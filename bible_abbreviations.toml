# Abréviations des livres bibliques, utilisées « dans une liste ou en note » (spec : Règles de rédaction des articles).
# En dehors des listes et des notes, la référence reste en toutes lettres (« Romains 8,28 »).
#
# SOURCE : convention universitaire de la Bible de Jérusalem (Gn, Ex, Lv, Nb, Dt, Rm, Jn, 1 Co…), la plus répandue dans
# l'édition savante francophone ; la TOB et les nouvelles Segond révisées suivent un système comparable. Les formes
# ci-dessous sont celles de la colonne « Jérus. » du tableau de Jean-Pierre Lacroux, « Abréviation des livres
# bibliques », extrait d'Orthotypographie (https://www.orthotypographie.fr), qui compare Osty, la Bible de Jérusalem,
# Segond 1910, la Bible en français courant et Maredsous. L'auteur y rappelle qu'il n'existe pas de liste normalisée.
# Les formes de la Segond 1910 (« Ge. », « Ro. », « Jn. »…) n'ont pas été retenues : avec point abréviatif, elles sont
# propres à cette édition. La spec renvoie à la page Segond 21 de universdelabible.net, qui ne donne que les noms complets.
#
# Pour en changer, modifiez la valeur de droite ; une valeur vide = nom complet conservé (avec un avertissement dans la
# fiche de relecture). Les clés sont les noms complets de la liste Segond 21 (voir BOOKS dans bible.py).
# Les livres à numéro s'écrivent avec une espace (« 1 S », « 1 Co »), comme dans la Bible de Jérusalem.
